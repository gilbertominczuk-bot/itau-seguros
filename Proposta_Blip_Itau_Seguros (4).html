   PROPOSTA BLIP × ITAÚ SEGUROS — base.css
   Nova identidade visual Blip (Instrument Sans + paleta oficial)
   Slides 16:9 navegáveis, offline.
   =========================================================================== */
:root{
  --blue:#0080FF; --navy:#00295B; --ink:#010106; --paper:#F7F5F0;
  --green:#6CCB95; --purple:#AE8DFE; --peach:#FFA175; --lime:#DEF74F;
  --gray:#595959; --gray2:#999999; --line:#E4E1DA; --white:#FFFFFF;
  --navy-soft:#0A3D7A;
  --slideW:1280px; --slideH:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Instrument Sans',system-ui,sans-serif;
  background:#2a2d33; color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ---------- deck / navegação ---------- */
.deck{position:relative}
.slide{
  position:relative; width:var(--slideW); height:var(--slideH);
  margin:24px auto; background:var(--paper); overflow:hidden;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.55); border-radius:6px;
}
@media print{
  body{background:#fff}
  .slide{margin:0;border-radius:0;box-shadow:none;page-break-after:always;width:100%;height:100vh}
  .nav,.hint{display:none!important}
}

/* barra de navegação fixa */
.nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:14px;background:rgba(0,41,91,.92);
  backdrop-filter:blur(8px);padding:9px 16px;border-radius:40px;
  box-shadow:0 8px 30px -8px rgba(0,0,0,.6)}
.nav button{background:var(--blue);border:none;color:#fff;width:34px;height:34px;
  border-radius:50%;cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.15s}
.nav button:hover{background:#2b95ff}
.nav button:disabled{opacity:.35;cursor:default}
.nav .count{color:#fff;font-size:13px;font-weight:500;min-width:54px;text-align:center;font-variant-numeric:tabular-nums}
.nav .title{color:#9Fc4f0;font-size:12px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;
  color:#cfd4da;font-size:12px;background:rgba(0,0,0,.35);padding:5px 12px;border-radius:20px}

/* ---------- tipografia comum ---------- */
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.eyebrow.on-dark{color:#7Fc0ff}
h1.title{font-size:52px;font-weight:700;line-height:1.05;color:var(--navy);letter-spacing:-.02em}
h2.title{font-size:38px;font-weight:700;line-height:1.1;color:var(--navy);letter-spacing:-.015em}
.title .accent{color:var(--blue)}
.sub{font-size:18px;font-weight:400;line-height:1.5;color:var(--gray)}
.itau-corner{position:absolute;top:26px;right:34px;height:32px;z-index:5}
.pagenum{position:absolute;bottom:30px;right:44px;font-size:13px;color:var(--gray2);font-weight:500}
.logo-fixed{position:absolute;bottom:26px;left:44px;height:22px}

/* padding padrão de conteúdo */
.pad{position:absolute;inset:0;padding:64px 72px}

/* ---------- fundos assinatura Blip ---------- */
/* fundo escuro com anéis concêntricos (capa) */
.bg-dark{background:radial-gradient(120% 120% at 78% 18%, #0b4ea0 0%, #06336e 34%, #04244f 55%, #021634 100%)}
.rings{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rings::before,.rings::after{content:'';position:absolute;border-radius:50%;
  border:70px solid rgba(60,130,230,.12);}
.rings::before{width:820px;height:820px;right:-160px;top:-180px;
  box-shadow:0 0 0 90px rgba(60,130,230,.06) inset}
.rings::after{width:520px;height:520px;right:20px;top:120px;
  border-color:rgba(90,160,255,.16)}
.spark{position:absolute;width:16px;height:16px;border-radius:50%}
.spark.g{background:var(--green)} .spark.p{background:var(--purple);border-radius:3px;transform:rotate(45deg)}
.spark.o{background:var(--peach)} .spark.l{background:var(--lime)}

/* fundo claro com anéis suaves (paper) */
.rings-soft{position:absolute;right:-120px;top:-120px;width:760px;height:760px;pointer-events:none;opacity:.55;overflow:hidden}
.slide{position:relative}
.rings-soft span{position:absolute;border-radius:50%;
  background:radial-gradient(circle, rgba(120,175,255,.0) 58%, rgba(120,175,255,.28) 72%, rgba(120,175,255,0) 86%)}

/* glow azul (fundo alternativo) */
.bg-glow{background:radial-gradient(90% 130% at 50% 118%, #0b57c4 0%, #073a86 30%, #041d44 60%, #010812 100%)}

/* ---------- componentes ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.card.tint{background:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:20px;
  font-size:13px;font-weight:600}
.chip.blue{background:rgba(0,128,255,.12);color:var(--blue)}
.chip.green{background:rgba(108,203,149,.20);color:#2f8f5b}
.chip.navy{background:var(--navy);color:#fff}
.icon-badge{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.icon-badge svg{width:24px;height:24px}
.ib-blue{background:var(--blue);color:#fff}
.ib-green{background:var(--green);color:#0b3d24}
.ib-purple{background:var(--purple);color:#2d1a55}
.ib-peach{background:var(--peach);color:#5a2a10}
.ib-navy{background:var(--navy);color:#fff}
.ib-soft{background:rgba(0,128,255,.10);color:var(--blue)}

.big-num{font-size:64px;font-weight:700;line-height:1;color:var(--blue);letter-spacing:-.03em}
.big-num.navy{color:var(--navy)} .big-num.green{color:var(--green)}

.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:18px;
  background:var(--paper);border:1px solid var(--line);color:var(--navy)}
.pill.k{background:rgba(0,41,91,.06)}

.bullet{display:flex;gap:11px;align-items:flex-start}
.bullet .bdot{width:20px;height:20px;border-radius:50%;background:rgba(0,128,255,.14);
  color:var(--blue);display:grid;place-items:center;flex:0 0 auto;margin-top:1px}
.bullet .bdot svg{width:12px;height:12px}
.bullet .btx{font-size:14.5px;line-height:1.45;color:#2c3a4d}
.bullet .btx b{color:var(--navy);font-weight:600}

.divider{height:1px;background:var(--line);border:none}

/* WhatsApp mini (para jornadas) */
.wa-mini{width:100%;background:#0b141a;border-radius:14px;padding:8px;overflow:hidden}
.wa-mini .wh{background:#075E54;border-radius:8px 8px 0 0;padding:8px 10px;display:flex;gap:8px;align-items:center}
.wa-mini .wa-av{width:26px;height:26px;border-radius:50%;background:#0C7C6F;display:grid;place-items:center}
.wa-mini .wa-av svg{width:14px;height:14px;color:#fff}
.wa-mini .wnm{color:#fff;font-size:11px;font-weight:600}
.wa-mini .wst{color:#cfefe9;font-size:8.5px}
.wa-mini .wbody{background:#0b141a;padding:9px 8px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.wa-mini .mb{max-width:82%;padding:6px 9px;border-radius:8px;font-size:10.5px;line-height:1.35}
.wa-mini .mb.in{background:#202c33;color:#e9edef;align-self:flex-start;border-top-left-radius:2px}
.wa-mini .mb.out{background:#005c4b;color:#e9edef;align-self:flex-end;border-top-right-radius:2px}
.wa-mini .mb b{color:#fff}

/* tabela de fluxos */
.ftable{width:100%;border-collapse:collapse;font-size:13.5px}
.ftable th{text-align:left;font-weight:600;color:var(--gray);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.06em;padding:0 12px 10px;border-bottom:2px solid var(--line)}
.ftable td{padding:11px 12px;border-bottom:1px solid var(--line);color:#2c3a4d;vertical-align:middle}
.ftable tr:last-child td{border-bottom:none}
.ftable .fn{font-weight:700;color:var(--navy)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:12px}
.tag.usar{background:rgba(0,128,255,.12);color:var(--blue)}
.tag.inad{background:rgba(255,161,117,.22);color:#b5551f}
.tag.impl{background:rgba(108,203,149,.22);color:#2f8f5b}

/* fluxo horizontal (steps) */
.flow-h{display:flex;align-items:stretch;gap:0}
.flow-step{flex:1;position:relative;padding:0 8px}
.flow-step .fs-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.flow-step .fs-t{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:5px}
.flow-step .fs-d{font-size:12px;line-height:1.4;color:var(--gray)}
.flow-arr{position:absolute;right:-10px;top:14px;color:var(--blue);z-index:2}
.flow-arr svg{width:18px;height:18px}

/* KPI grid */
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .kl{font-size:12.5px;color:var(--gray);font-weight:500}

/* two-col */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
</style>
</head>

const deck = document.getElementById('deck');
SLIDES.forEach(s=>{
  const wrap=document.createElement('div');
  wrap.innerHTML = s.html.replace(/src="LOGO"/g, `src="${LOGOURI}"`).replace(/src="ITAUW"/g,`src="${ITAUW}"`).replace(/src="ITAUN"/g,`src="${ITAUN}"`);
  deck.appendChild(wrap.firstElementChild);
});
const slides=[...document.querySelectorAll('.slide')];
slides.forEach(s=>{ if(!s.classList.contains('bg-dark')){ const im=document.createElement('img'); im.src=ITAUN; im.className='itau-corner'; s.appendChild(im); } });
document.getElementById('tot').textContent=slides.length;
let idx=0;
function show(i){
  idx=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,k)=>s.style.display=k===idx?'block':'none');
  document.getElementById('cur').textContent=idx+1;
  document.getElementById('ntitle').textContent=SLIDES[idx].title;
  document.getElementById('prev').disabled=idx===0;
  document.getElementById('next').disabled=idx===slides.length-1;
  window.scrollTo(0,0);
}
document.getElementById('prev').onclick=()=>show(idx-1);
document.getElementById('next').onclick=()=>show(idx+1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(idx+1);
  else if(e.key==='ArrowLeft')show(idx-1);
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
  else if(e.key==='p'||e.key==='P'){e.preventDefault();slides.forEach(s=>s.style.display='block');window.print();setTimeout(()=>show(idx),400);}
});
// swipe mobile
let sx=0;document.addEventListener('touchstart',e=>sx=e.touches[0].clientX);
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(idx+(dx<0?1:-1));});
show(0);
// auto-scale para caber na viewport
function fit(){
  const s=slides[idx];if(!s)return;
  const scale=Math.min(1,(window.innerWidth-40)/1280,(window.innerHeight-120)/720);
  slides.forEach(sl=>{sl.style.transform=`scale(${scale})`;sl.style.transformOrigin='top center';});
  deck.style.height=(720*scale+48)+'px';
}
window.addEventListener('resize',fit);fit();
</script>
